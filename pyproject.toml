[project]
name = "job-hunt-agent"
version = "0.1.0"
description = "Tailor your resume to a job posting with three CrewAI agents — using only true facts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewai[litellm]>=1.15,<2",  # built and tested with crewai 1.15.29
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
job-hunt = "job_hunt_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_hunt_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
